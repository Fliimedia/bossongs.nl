<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bossongs</title>
    <meta name="build" content="b18" />
    <meta name="description" content="Nyarayek en Sten, 19 september 2026." />
    <meta name="theme-color" content="#f8f5ee" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <!-- De letter wordt pas gebruikt zodra het menu opengaat, dus hij mag de
         eerste weergave niet ophouden: als print geladen, daarna aangezet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <style>
      :root { color-scheme: light; --paper:#f8f5ee; --ink:#15150f; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
      }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      .stage {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 6vmin;
        box-sizing: border-box;
      }
      .mark {
        display: block;
        width: min(64vw, 46svh, 430px);
        height: auto;
        transform: scale(1.045) translateY(12px);
        animation: settle 4s cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }
      .mark-monogram { opacity: 0; animation: rise 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both; }
      .mark-word     { opacity: 0; animation: rise 2s   cubic-bezier(0.4, 0, 0.2, 1) 1.15s both; }
      .mark-rule {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: draw 1.6s cubic-bezier(0.22, 1, 0.36, 1) 1.7s both;
      }
      @keyframes settle { to { transform: none; } }
      @keyframes rise   { to { opacity: 1; } }
      @keyframes draw   { from { opacity: 0; transform: scaleX(0.25); } to { opacity: 1; transform: none; } }

      /* knop rechtsboven: drie streepjes, waarvan het middelste korter, zodat
         het blok rechts uitlijnt en links een trap maakt */
      .nav-btn {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 1.1rem);
        right: calc(env(safe-area-inset-right) + 1.1rem);
        z-index: 50;
        width: 44px; height: 44px; padding: 0;
        border: 0; background: none; color: var(--ink); cursor: pointer;
        opacity: 0;
        animation: fadeIn 900ms ease 2.2s both;
        -webkit-tap-highlight-color: transparent;
      }
      .nav-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
      .bars, .cross, .bmark { position: absolute; inset: 0; }
      .bars i, .cross i {
        position: absolute; right: 12px; height: 1px; width: 20px;
        background: currentColor;
        transform-origin: center;
        transition: transform 320ms cubic-bezier(0.2, 0.7, 0.3, 1);
      }
      /* twee haarlijnen, verder niets; hun midden valt samen met dat van de B */
      .bars i:nth-child(1) { top: 18.5px; }
      .bars i:nth-child(2) { top: 24.5px; }
      .nav-btn:hover .bars i:nth-child(1) { transform: translateY(-1.5px); }
      .nav-btn:hover .bars i:nth-child(2) { transform: translateY(1.5px); }

      .cross { opacity: 0; visibility: hidden; }
      .cross i { top: 21.5px; }
      .cross i:nth-child(1) { transform: rotate(45deg); }
      .cross i:nth-child(2) { transform: rotate(-45deg); }

      .bmark { display: grid; place-items: center; opacity: 0; }
      .bmark svg { height: 20px; width: auto; display: block; }

      /* De omslag loopt in één doorlopende beweging van 1,6s. Alles staat in de
         fase "opening"; "open" is precies de stand waarin die animaties
         eindigen, dus de overgang ertussen is onzichtbaar. Het menu begint al
         op te komen terwijl de B nog wegvalt. */
      [data-nav="opening"] .bars { animation: sink 320ms cubic-bezier(0.4, 0, 1, 1) both; }
      [data-nav="opening"] .bmark { animation: bGo 1200ms cubic-bezier(0.33, 0, 0.2, 1) 200ms both; }
      @keyframes bGo {
        0%   { opacity: 0; transform: scale(0.72); }
        40%  { opacity: 1; transform: scale(1); }
        55%  { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.22); }
      }
      [data-nav="opening"] .cross { visibility: visible; animation: fadeIn 400ms ease 1200ms both; }
      [data-nav="open"] .bars { opacity: 0; visibility: hidden; }
      [data-nav="open"] .cross { opacity: 1; visibility: visible; }
      [data-nav="closing"] .cross { visibility: visible; animation: sink 260ms ease both; }
      [data-nav="closing"] .bars { animation: fadeIn 360ms ease 200ms both; }

      .menu {
        position: fixed; inset: 0; z-index: 40;
        display: grid; place-items: center;
        background: var(--paper);
        opacity: 0; visibility: hidden;
      }
      [data-nav="opening"] .menu {
        visibility: visible; pointer-events: none;
        animation: fadeIn 600ms cubic-bezier(0.33, 0, 0.2, 1) 950ms both;
      }
      [data-nav="open"] .menu { visibility: visible; opacity: 1; }
      [data-nav="closing"] .menu { visibility: visible; animation: sink 400ms ease both; }
      .menu ul {
        list-style: none; margin: 0; padding: 0;
        display: grid; justify-items: center; text-align: center;
        gap: clamp(1.1rem, 4.5vh, 2.25rem);
      }
      .menu a {
        display: inline-block;
        font-family: "Instrument Serif", "Iowan Old Style", Palatino, Georgia, serif;
        font-size: clamp(2rem, 9vw, 3.25rem);
        line-height: 1.1;
        letter-spacing: 0.005em;
        color: var(--ink);
        text-decoration: none;
        opacity: 0;
        transition: opacity 240ms ease;
      }
      .menu a::after {
        content: ""; display: block; height: 1px; margin-top: 0.3rem;
        background: currentColor; transform: scaleX(0); transform-origin: center;
        transition: transform 320ms cubic-bezier(0.2, 0.7, 0.3, 1);
      }
      .menu a:hover::after, .menu a:focus-visible::after { transform: scaleX(1); }
      .menu a:focus-visible { outline: 0; }
      [data-nav="opening"] .menu a { animation: lift 480ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
      [data-nav="opening"] .menu li:nth-child(1) a { animation-delay: 1000ms; }
      [data-nav="opening"] .menu li:nth-child(2) a { animation-delay: 1100ms; }
      [data-nav="open"] .menu a, [data-nav="closing"] .menu a { opacity: 1; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sink { from { opacity: 1; } to { opacity: 0; } }
      @keyframes lift { from { opacity: 0; transform: translateY(0.65rem); } to { opacity: 1; transform: none; } }

      @media (prefers-reduced-motion: reduce) {
        .mark { transform: none; }
        .mark, .mark-monogram, .mark-word, .mark-rule, .nav-btn { opacity: 1; animation: none; }
        [data-nav="opening"] .cross, [data-nav="opening"] .menu,
        [data-nav="opening"] .menu a, [data-nav="closing"] .cross,
        [data-nav="closing"] .bars, [data-nav="closing"] .menu { animation: none; opacity: 1; }
        [data-nav="opening"] .bars, [data-nav="opening"] .bmark { animation: none; opacity: 0; }
        [data-nav="opening"] .menu { pointer-events: auto; }
        .menu a, .bars i, .cross i { transition: none; }
      }
    </style>
  </head>

    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById("navbtn");
        var menu = document.getElementById("navmenu");
        var still = window.matchMedia("(prefers-reduced-motion: reduce)");
        var timer = 0;

        function phase(name) {
          if (name) root.setAttribute("data-nav", name);
          else root.removeAttribute("data-nav");
        }

        function open() {
          window.clearTimeout(timer);
          btn.setAttribute("aria-expanded", "true");
          // De streepjes worden eerst de B, die daarna vervaagt; pas daarna
          // komt het menu. Zonder animatievoorkeur slaan we de omslag over.
          var ceremony = still.matches ? 0 : 1600;
          phase("opening");
          timer = window.setTimeout(function () {
            phase("open");
            var first = menu.querySelector("a");
            if (first) first.focus();
          }, ceremony);
        }

        function close() {
          window.clearTimeout(timer);
          btn.setAttribute("aria-expanded", "false");
          phase("closing");
          btn.focus();
          timer = window.setTimeout(function () {
            phase("");
          }, still.matches ? 0 : 560);
        }

        btn.addEventListener("click", function () {
          if (btn.getAttribute("aria-expanded") === "true") close();
          else open();
        });

        menu.addEventListener("click", function (e) {
          if (e.target === menu || e.target.tagName === "UL") close();
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && btn.getAttribute("aria-expanded") === "true") close();
        });
      })();
