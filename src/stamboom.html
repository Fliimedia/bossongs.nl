<html lang="nl">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stamboom</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f8f5ee" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" />
    <style>
      :root{--paper:#f8f5ee;--ink:#15150f;--muted:#8a8578;--hair:rgba(21,21,15,0.12);--line:#c9b998;--gold:#8f6f2e;}
      *{box-sizing:border-box;}
      html,body{margin:0;background:var(--paper);color:var(--ink);}
      body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:2rem 0.75rem;font-family:"Instrument Serif",Georgia,serif;-webkit-font-smoothing:antialiased;}
      .logo{display:flex;justify-content:center;margin:0 0 0.4rem;color:var(--ink);}
      .logo svg{height:2.4rem;width:auto;display:block;fill:currentColor;}
      h1{margin:0 0 2rem;font-weight:400;font-size:1.9rem;line-height:1.1;letter-spacing:-0.01em;text-align:center;}
      .scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
      .scroll::-webkit-scrollbar{display:none;}
      .tree{display:flex;justify-content:center;min-width:max-content;margin:0 auto;}
      .tree ul{position:relative;display:flex;justify-content:center;margin:0;padding:1.4rem 0 0;}
      .tree > ul{padding-top:0;}
      .tree li{position:relative;list-style:none;padding:1.4rem 0.22rem 0;display:flex;flex-direction:column;align-items:center;}
      .tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:1.4rem;border-top:1px solid var(--line);}
      .tree li::after{right:auto;left:50%;border-left:1px solid var(--line);}
      .tree li:only-child::before,.tree li:only-child::after{display:none;}
      .tree li:only-child{padding-top:0;}
      .tree > ul > li{padding-top:0;}
      .tree li:first-child::before,.tree li:last-child::after{border:0;}
      .tree li:last-child::before{border-right:1px solid var(--line);border-radius:0 8px 0 0;}
      .tree li:first-child::after{border-radius:8px 0 0 0;}
      .tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:1.4rem;border-left:1px solid var(--line);}
      .tree li:only-child > .node{margin-top:0;}
      .node{display:flex;flex-direction:column;align-items:center;gap:0.15rem;padding:0.6rem 0.75rem 0.55rem;border-radius:12px;
        background:rgba(255,255,255,0.45);box-shadow:inset 0 0 0 1px var(--hair);}
      .p{display:flex;flex-direction:column;align-items:center;}
      .name{font-size:1.15rem;line-height:1.2;white-space:nowrap;}
      .and{color:var(--gold);font-size:0.95rem;line-height:1;}
      .soc{display:flex;gap:0.35rem;margin-top:0.2rem;}
      .soc:empty{display:none;}
      .soc a{display:inline-flex;color:var(--gold);line-height:0;border-radius:4px;}
      .soc a:hover{color:var(--ink);}
      .soc svg{width:1rem;height:1rem;}
      @media (max-width:380px){.tree li{padding-left:0.12rem;padding-right:0.12rem;}.node{padding-left:0.55rem;padding-right:0.55rem;}.name{font-size:1.08rem;}}
      @media (min-width:900px){.logo svg{height:3rem;}h1{font-size:2.6rem;margin-bottom:3rem;}.tree ul{padding-top:2rem;}.tree li{padding:2rem 0.6rem 0;}.tree li::before,.tree li::after,.tree ul ul::before{height:2rem;}.node{padding:0.9rem 1.3rem 0.8rem;border-radius:14px;}.name{font-size:1.5rem;}.and{font-size:1.15rem;}.soc svg{width:1.2rem;height:1.2rem;}}
      .soc a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
    </style>
  </head>
  <body>
    <div class="logo" aria-hidden="true"><!--LOGO--></div>
    <h1>Stamboom</h1>
    <div class="scroll">
      <div class="tree">
<!--TREE-->
      </div>
    </div>
  </body>
</html>
