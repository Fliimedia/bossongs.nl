<html lang="nl">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stamboom</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f8f5ee" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" />
    <style>
      :root{--paper:#f8f5ee;--ink:#15150f;--muted:#9a9486;--line:#d8ccb2;--gold:#8f6f2e;}
      *{box-sizing:border-box;}
      html,body{margin:0;background:var(--paper);color:var(--ink);}
      body{min-height:100svh;display:flex;flex-direction:column;justify-content:center;
        padding:2.5rem 0;font-family:"Instrument Serif",Georgia,serif;-webkit-font-smoothing:antialiased;}
      .logo{display:flex;justify-content:center;margin:0 0 0.35rem;color:var(--ink);}
      .logo svg{height:1.7rem;width:auto;display:block;fill:currentColor;}
      h1{margin:0 0 2.25rem;font-weight:400;font-size:1.15rem;letter-spacing:0.02em;text-align:center;color:var(--muted);}
      .scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
      .scroll::-webkit-scrollbar{display:none;}
      .tree{position:relative;width:max-content;margin:0 auto;padding:0 1.25rem;}
      .tree ul{display:flex;justify-content:center;align-items:flex-start;gap:0.9rem;margin:0;padding:2.1rem 0 0;}
      .tree > ul{padding-top:0;}
      .tree > ul > li > ul{gap:2.6rem;}
      .tree li{list-style:none;display:flex;flex-direction:column;align-items:center;}
      .lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
      .lines path{fill:none;stroke:var(--line);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;}
      .node{display:flex;align-items:flex-start;}
      .tie{width:0.9rem;height:1.1px;margin:0.62rem 0.35rem 0;border-radius:1px;background:var(--line);flex:none;}
      .p{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:3.4rem;padding:0 0.1rem;}
      .first{font-size:1.02rem;line-height:1.2;white-space:nowrap;}
      .last{margin-top:0.12rem;font-family:Inter,system-ui,sans-serif;font-size:0.56rem;line-height:1.2;letter-spacing:0.12em;
        text-transform:uppercase;color:var(--muted);white-space:nowrap;}
      .soc{display:flex;gap:0.3rem;margin-top:0.3rem;}
      .soc:empty{display:none;}
      .soc a{display:inline-flex;color:var(--gold);line-height:0;opacity:0.75;border-radius:3px;}
      .soc a:hover{opacity:1;}
      .soc svg{width:0.8rem;height:0.8rem;}
      .soc a:focus-visible{outline:1px solid var(--ink);outline-offset:2px;}
      .extra{position:absolute;top:0;left:0;}
      @media (min-width:900px){.logo svg{height:2.2rem;}h1{font-size:1.35rem;margin-bottom:3rem;}
        .tree ul{gap:1.6rem;padding-top:2.75rem;}.first{font-size:1.25rem;}.last{font-size:0.62rem;}.tie{width:1.3rem;margin:0.75rem 0.4rem 0;}.tree > ul > li > ul{gap:4rem;}.soc svg{width:0.9rem;height:0.9rem;}}
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" />
  </head>
  <body>
    <div class="logo" aria-hidden="true"><!--LOGO--></div>
    <h1>Stamboom</h1>
    <div class="scroll">
      <div class="tree">
<!--TREE-->
      </div>
    </div>
    <script>
      (function () {
        var scroll = document.querySelector(".scroll");
        var tree = document.querySelector(".tree");
        var NS = "http://www.w3.org/2000/svg";
        var svg = document.createElementNS(NS, "svg");
        svg.setAttribute("class", "lines");
        svg.setAttribute("aria-hidden", "true");
        var path = document.createElementNS(NS, "path");
        svg.appendChild(path);
        tree.appendChild(svg);
        var GAP = 6; // ruimte tussen lijn en naam
        var RAD = 10; // straal van de bochten
        var r = function (n) { return Math.round(n) + 0.5; };
        function box(el) {
          var o = tree.getBoundingClientRect(), b = el.getBoundingClientRect();
          return { l: b.left - o.left, t: b.top - o.top, w: b.width, h: b.height, x: b.left - o.left + b.width / 2, b: b.bottom - o.top };
        }
        function draw() {
          // Een ouder boven een aangetrouwde persoon: boven die persoon, op de hoogte van de bovenste rij.
          var top = box(tree.querySelector(":scope > ul > li > .node")).t;
          tree.querySelectorAll(".extra").forEach(function (ex) {
            var target = box(document.getElementById(ex.getAttribute("data-of")));
            ex.style.left = target.x - ex.offsetWidth / 2 + "px";
            ex.style.top = top + "px";
          });
          var d = "";
          tree.querySelectorAll("li").forEach(function (li) {
            var kids = li.querySelector(":scope > ul");
            if (!kids) return;
            var node = li.querySelector(":scope > .node");
            var tie = node.querySelector(".tie");
            var a = box(tie || node);
            var x0 = a.x, y0 = tie ? a.t : a.b + GAP;
            var cards = Array.prototype.map.call(kids.querySelectorAll(":scope > li > .node > .blood"), box);
            var bus = box(kids).t + (cards[0].t - box(kids).t) / 2;
            // Per kind een eigen lijn met zachte bochten: omlaag, opzij, omlaag.
            cards.forEach(function (c) {
              var dx = c.x - x0, end = c.t - GAP;
              if (Math.abs(dx) < 1) { d += "M" + r(x0) + " " + r(y0) + "V" + r(end); return; }
              var k = Math.min(RAD, Math.abs(dx) / 2, (bus - y0) , (end - bus));
              var s = dx > 0 ? 1 : -1;
              d += "M" + r(x0) + " " + r(y0) + "V" + r(bus - k) +
                "Q" + r(x0) + " " + r(bus) + " " + r(x0 + s * k) + " " + r(bus) +
                "H" + r(c.x - s * k) +
                "Q" + r(c.x) + " " + r(bus) + " " + r(c.x) + " " + r(bus + k) +
                "V" + r(end);
            });
          });
          tree.querySelectorAll(".extra").forEach(function (ex) {
            var p = box(ex.querySelector(".p"));
            var target = box(document.getElementById(ex.getAttribute("data-of")));
            d += "M" + r(p.x) + " " + r(p.b + GAP) + "V" + r(target.t - GAP);
          });
          path.setAttribute("d", d);
          svg.setAttribute("width", tree.offsetWidth);
          svg.setAttribute("height", tree.offsetHeight);
        }
        function center() {
          var me = document.getElementById("sten");
          if (!me || scroll.scrollWidth <= scroll.clientWidth) return;
          var b = me.getBoundingClientRect(), s = scroll.getBoundingClientRect();
          scroll.scrollLeft += b.left + b.width / 2 - (s.left + s.width / 2);
        }
        draw();
        center();
        window.addEventListener("resize", draw);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); center(); });
        window.addEventListener("load", draw);
      })();
    </script>
  </body>
</html>
