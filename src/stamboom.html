<html lang="nl">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stamboom</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f8f5ee" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" />
    <style>
      :root{--paper:#f8f5ee;--ink:#15150f;--muted:#8a8578;--hair:rgba(21,21,15,0.12);--line:#c9b998;--gold:#8f6f2e;}
      *{box-sizing:border-box;}
      html,body{margin:0;background:var(--paper);color:var(--ink);}
      body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:2rem 0.75rem;font-family:"Instrument Serif",Georgia,serif;-webkit-font-smoothing:antialiased;}
      .logo{display:flex;justify-content:center;margin:0 0 0.4rem;color:var(--ink);}
      .logo svg{height:2.4rem;width:auto;display:block;fill:currentColor;}
      h1{margin:0 0 2rem;font-weight:400;font-size:1.9rem;line-height:1.1;letter-spacing:-0.01em;text-align:center;}
      .scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
      .scroll::-webkit-scrollbar{display:none;}
      .tree{position:relative;display:flex;justify-content:center;min-width:max-content;margin:0 auto;padding:0 0.25rem;}
      .tree ul{display:flex;justify-content:center;align-items:flex-start;gap:0.4rem;margin:0;padding:1.75rem 0 0;}
      .tree > ul{padding-top:0;}
      .tree li{list-style:none;display:flex;flex-direction:column;align-items:center;}
      .lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
      .lines path{fill:none;stroke:var(--line);stroke-width:1;}
      .node{display:flex;align-items:center;}
      .p{display:flex;align-items:center;gap:0.4rem;height:2.6rem;padding:0 0.7rem;border-radius:12px;
        background:rgba(255,255,255,0.45);box-shadow:inset 0 0 0 1px var(--hair);}
      .name{font-size:1.15rem;line-height:1;white-space:nowrap;}
      .tie{width:0.7rem;height:1px;background:var(--line);flex:none;}
      .soc{display:flex;gap:0.3rem;}
      .soc:empty{display:none;}
      .soc a{display:inline-flex;color:var(--gold);line-height:0;border-radius:4px;}
      .soc a:hover{color:var(--ink);}
      .soc svg{width:1rem;height:1rem;}
      @media (max-width:440px){.tree ul{gap:0.25rem;}.p{padding:0 0.5rem;height:2.4rem;gap:0.3rem;}.tie{width:0.45rem;}.name{font-size:1.05rem;}.soc svg{width:0.9rem;height:0.9rem;}}
      @media (max-width:380px){.tree ul{gap:0.2rem;}.p{padding:0 0.42rem;}.name{font-size:1rem;}}
      @media (min-width:900px){.logo svg{height:3rem;}h1{font-size:2.6rem;margin-bottom:3rem;}.tree ul{padding-top:2.5rem;gap:1.2rem;}.p{height:3.4rem;padding:0 1.2rem;border-radius:14px;gap:0.55rem;}.tie{width:1.4rem;}.name{font-size:1.5rem;}.soc svg{width:1.2rem;height:1.2rem;}}
      .soc a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
    </style>
  </head>
  <body>
    <div class="logo" aria-hidden="true"><!--LOGO--></div>
    <h1>Stamboom</h1>
    <div class="scroll">
      <div class="tree">
<!--TREE-->
      </div>
    </div>
    <script>
      // Lijnen: vanaf het midden tussen een stel (of onder een ouder) omlaag naar elk kind.
      (function () {
        var tree = document.querySelector(".tree");
        var NS = "http://www.w3.org/2000/svg";
        var svg = document.createElementNS(NS, "svg");
        svg.setAttribute("class", "lines");
        svg.setAttribute("aria-hidden", "true");
        var path = document.createElementNS(NS, "path");
        svg.appendChild(path);
        tree.appendChild(svg);
        function draw() {
          var o = tree.getBoundingClientRect();
          var d = "";
          var r = function (n) { return Math.round(n) + 0.5; };
          tree.querySelectorAll("li").forEach(function (li) {
            var kids = li.querySelector(":scope > ul");
            if (!kids) return;
            var node = li.querySelector(":scope > .node");
            var tie = node.querySelector(".tie");
            var a = (tie || node).getBoundingClientRect();
            var x0 = a.left + a.width / 2 - o.left;
            var y0 = (tie ? a.top + a.height / 2 : a.bottom) - o.top;
            var cards = Array.prototype.map.call(kids.querySelectorAll(":scope > li > .node > .p:first-child"), function (p) {
              var b = p.getBoundingClientRect();
              return { x: b.left + b.width / 2 - o.left, y: b.top - o.top };
            });
            var top = kids.getBoundingClientRect().top - o.top;
            var cy = cards[0].y;
            var bus = top + (cy - top) / 2;
            d += "M" + r(x0) + " " + r(y0) + "V" + r(bus);
            var xs = cards.map(function (c) { return c.x; }).concat([x0]);
            d += "M" + r(Math.min.apply(null, xs)) + " " + r(bus) + "H" + r(Math.max.apply(null, xs));
            cards.forEach(function (c) { d += "M" + r(c.x) + " " + r(bus) + "V" + r(c.y); });
          });
          path.setAttribute("d", d);
          svg.setAttribute("width", tree.offsetWidth);
          svg.setAttribute("height", tree.offsetHeight);
        }
        draw();
        window.addEventListener("resize", draw);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
        window.addEventListener("load", draw);
      })();
    </script>
  </body>
</html>
