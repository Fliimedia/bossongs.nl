<html lang="nl">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Foto albums</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f8f5ee" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" />
    <style>
      :root{--paper:#f8f5ee;--ink:#15150f;--hair:rgba(21,21,15,0.12);--gold:#8f6f2e;}
      *{box-sizing:border-box;}
      html,body{margin:0;background:var(--paper);color:var(--ink);}
      body{min-height:100svh;display:flex;align-items:center;justify-content:center;
        padding:2rem 1.25rem;font-family:"Instrument Serif",Georgia,serif;-webkit-font-smoothing:antialiased;}
      main{width:100%;max-width:24rem;display:flex;flex-direction:column;align-items:center;}
      .logo{display:flex;justify-content:center;margin:0 0 2.25rem;color:var(--ink);}
      .logo svg{height:3rem;width:auto;display:block;fill:currentColor;}
      nav{width:100%;display:flex;flex-direction:column;gap:0.75rem;}
      .lnk{position:relative;display:flex;align-items:center;justify-content:center;height:3.6rem;
        padding:0 3.5rem;border-radius:12px;color:var(--ink);text-decoration:none;font-size:1.4rem;
        letter-spacing:-0.005em;box-shadow:inset 0 0 0 1px var(--hair);
        transition:box-shadow 200ms ease,background-color 200ms ease,transform 200ms ease;}
      .lnk .ic{position:absolute;left:1.1rem;top:50%;width:1.6rem;height:1.6rem;margin-top:-0.8rem;color:var(--gold);}
      .lnk:hover{background:rgba(143,111,46,0.07);box-shadow:inset 0 0 0 1px var(--gold);}
      .lnk:active{transform:scale(0.985);}
      .lnk:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true"><!--LOGO--></div>
      <nav aria-label="Foto albums">
        <a class="lnk" href="/trouw-album/"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><circle cx="128" cy="164" r="62"/><path d="M98 78l16-30h28l16 30-30 24z"/></g></svg><span>Trouw album</span></a>
      </nav>
    </main>
  </body>
</html>
